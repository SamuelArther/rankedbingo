<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranked Bingo</title>
<meta name="description" content="Answer questions about how you live, work and think to see which U.S. military branch fits you best.">
<style>
  :root {
    --bg: #0b0f0c;
    --panel: #121912;
    --panel-2: #182118;
    --line: #26332a;
    --text: #e3eadf;
    --muted: #8d9a8a;
    --accent: #9fd36b;
    --accent-ink: #0b0f0c;
    --warn: #e8b04a;
    --focus: #d6f5b0;
    --radius: 14px;
    --mono: ui-monospace, "Cascadia Mono", "Consolas", "SF Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, rgba(159, 211, 107, 0.08), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(255, 255, 255, 0.025) 31px 32px),
      repeating-linear-gradient(90deg, transparent 0 31px, rgba(255, 255, 255, 0.025) 31px 32px),
      var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }

  main { width: 100%; max-width: 680px; }

  .eyebrow {
    font: 600 12px/1 var(--mono);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 10px 0 12px; letter-spacing: -0.01em; }
  h2 { font-size: clamp(20px, 4.5vw, 26px); line-height: 1.25; margin: 10px 0 20px; }

  p { margin: 0 0 14px; }
  .muted { color: var(--muted); }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(20px, 5vw, 32px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .branch-strip { margin: 18px 0 24px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);
    font-size: 14px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  button {
    font: inherit; color: inherit; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2);
    border-radius: 10px; padding: 12px 18px;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  @media (hover: hover) {
    button:hover { border-color: var(--accent); }
    button:disabled:hover { border-color: var(--line); }
    .primary:hover { filter: brightness(1.08); }
    .primary:disabled:hover { border-color: var(--accent); filter: none; }
  }
  button { -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(0.99); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: default; }

  .primary {
    background: var(--accent); color: var(--accent-ink);
    border-color: var(--accent); font-weight: 700;
  }

  .progress-row {
    display: flex; justify-content: space-between; align-items: center;
    font: 600 12px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .progress { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.3s ease; }

  .options { display: grid; gap: 10px; }
  .option {
    display: flex; gap: 14px; align-items: flex-start;
    text-align: left; width: 100%; padding: 14px 16px;
  }
  .option .key {
    flex: none; width: 26px; height: 26px; border-radius: 7px;
    display: grid; place-items: center;
    font: 700 13px/1 var(--mono); color: var(--muted);
    border: 1px solid var(--line); background: var(--bg);
  }
  .option.selected { border-color: var(--accent); background: rgba(159, 211, 107, 0.1); }
  .option.selected .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  nav#nav {
    width: 100%; max-width: 680px; display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 10px; margin-bottom: 18px;
  }
  .brand { font: 700 15px/1 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); text-decoration: none; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab {
    padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); text-decoration: none; font-size: 14px; background: var(--panel);
  }
  .tab.active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 700; }

  a { color: var(--accent); }
  a.button {
    display: inline-block; text-decoration: none; color: var(--text);
    border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 12px 18px;
  }
  a.button.primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .back-link { font-size: 14px; text-decoration: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 18px; }
  .branch-card {
    display: block; text-decoration: none; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--hero);
    border-radius: 12px; padding: 16px;
  }
  @media (hover: hover) { .branch-card:hover, .tab:hover { border-color: var(--accent); } }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .fact { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; font-size: 14px; }
  .fact-k { font: 600 11px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 18px; }

  .seg-row { display: grid; gap: 6px; margin-top: 14px; }
  .seg-label { font: 600 11px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg-item {
    padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); text-decoration: none; font-size: 14px;
  }
  .seg-item.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .seg-item.disabled { opacity: 0.4; text-decoration: line-through; cursor: not-allowed; }

  .steps { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
  .steps.compact { gap: 8px; font-size: 15px; }
  .steps li::marker { color: var(--accent); font: 700 14px var(--mono); }

  details.job summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  details.job summary::-webkit-details-marker { display: none; }
  details.job summary::after { content: "+"; font: 700 18px var(--mono); color: var(--hero); }
  details.job[open] summary::after { content: "–"; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font: 600 11px/1.4 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--panel-2); }
  tr:last-child td { border-bottom: 0; }

  .debug { display: block; margin-top: 4px; font: 12px/1.4 var(--mono); color: var(--warn); }
  .debug-live { margin: -10px 0 14px; }

  .skip {
    display: block; width: 100%; margin-top: 10px; padding: 10px 16px;
    background: transparent; border-style: dashed; color: var(--muted); font-size: 14px;
  }
  .skip.selected { border-color: var(--accent); border-style: solid; color: var(--text); }

  .nav { display: flex; justify-content: space-between; margin-top: 20px; }

  .result-hero { border-left: 4px solid var(--hero, var(--accent)); padding-left: 16px; margin-bottom: 22px; }
  .result-hero .pct { font: 700 14px/1 var(--mono); color: var(--hero, var(--accent)); letter-spacing: 0.1em; }

  .section-title {
    font: 600 12px/1 var(--mono); letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin: 26px 0 12px;
  }

  .list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .list li { display: flex; gap: 10px; align-items: flex-start; }
  .list .mark { flex: none; font: 700 14px/1.5 var(--mono); }
  .list.good .mark { color: var(--accent); }
  .list.warn .mark { color: var(--warn); }

  .bars { display: grid; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: 112px 1fr 44px; gap: 12px; align-items: center; font-size: 14px; }
  .bar { height: 10px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 999px; transition: width 0.8s cubic-bezier(.2,.8,.2,1); }
  .bar-row .num { font-family: var(--mono); text-align: right; color: var(--muted); }

  .jobs { display: grid; gap: 10px; }
  .job { background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--hero); border-radius: 10px; padding: 14px 16px; }
  .job-path { font: 600 11px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--hero); margin-bottom: 4px; }
  .job-name { font-size: 18px; }

  .runner-up { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }

  .note { background: rgba(159, 211, 107, 0.07); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }

  footer { max-width: 680px; margin-top: 22px; font-size: 13px; color: var(--muted); text-align: center; }

  .fade-in { animation: fade 0.25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  @media (max-width: 480px) {
    .bar-row { grid-template-columns: 92px 1fr 40px; font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<nav id="nav" aria-label="Sections"></nav>
<main id="app" aria-live="polite"></main>
<footer>
  Just for fun. Not affiliated with or endorsed by the U.S. military or any branch.
  Talk to a recruiter from each branch you're interested in before deciding anything.
</footer>

<script>
"use strict";

// Traits run from -2 to +2. Each has a phrase for each direction, used to
// explain results.
const TRAITS = {
  sea:       { pos: "lots of time at sea",              neg: "staying on dry land" },
  land:      { pos: "field work on land",               neg: "work away from the field" },
  air:       { pos: "aircraft and flying",              neg: "work away from aviation" },
  space:     { pos: "space and satellites",             neg: "work here on Earth rather than in space" },
  physical:  { pos: "hard physical challenges",         neg: "less physically demanding work" },
  tech:      { pos: "highly technical work",            neg: "hands-on, non-technical work" },
  tradition: { pos: "strict discipline and tradition",  neg: "a relaxed, professional culture" },
  travel:    { pos: "deploying far from home",          neg: "staying close to home" },
  homeland:  { pos: "home-front work like rescues, disaster response and policing", neg: "overseas military missions" },
  combat:    { pos: "front-line combat roles",          neg: "support and non-combat roles" },
  scale:     { pos: "a huge organization",              neg: "a small, tight-knit branch" },
  comfort:   { pos: "comfortable living conditions",    neg: "roughing it" },
};

// Branch profiles on the same -2..+2 scale. These are broad generalizations;
// every branch has a wide range of jobs.
const BRANCHES = {
  army: {
    name: "Army",
    color: "#8fa45a",
    tagline: "The biggest branch, with a job for almost everything.",
    about: "The Army handles land operations. Because it's so big, it has a huge range of jobs: infantry, armor, artillery, medicine, engineering, logistics, intelligence, cyber, and more helicopters than any other branch.",
    traits: { sea: -1, land: 2, air: 0, space: -1, physical: 1, tech: 0, tradition: 1, travel: 1, homeland: 0, combat: 2, scale: 2, comfort: 0 },
  },
  usmc: {
    name: "Marine Corps",
    color: "#d0453a",
    tagline: "A fast, tough expeditionary force.",
    about: "The Marines deploy quickly by sea and air, often from Navy ships. It's part of the Department of the Navy. It's known for the toughest boot camp, strong tradition, and an \"every Marine a rifleman\" mindset, no matter the job.",
    traits: { sea: 1, land: 2, air: 0, space: -2, physical: 2, tech: -1, tradition: 2, travel: 2, homeland: -1, combat: 2, scale: 0, comfort: -2 },
  },
  navy: {
    name: "Navy",
    color: "#4a7fd6",
    tagline: "Ships, submarines and carriers around the world.",
    about: "The Navy operates on, under and above the sea worldwide. It has lots of technical jobs, from nuclear power and engineering to aviation, plus long deployments and port visits in other countries.",
    traits: { sea: 2, land: -1, air: 1, space: -1, physical: 0, tech: 1, tradition: 1, travel: 2, homeland: -1, combat: 0, scale: 1, comfort: -1 },
  },
  af: {
    name: "Air Force",
    color: "#5fb8e8",
    tagline: "Aircraft, tech, and a good quality of life.",
    about: "The Air Force runs aircraft, airlift, refueling and a lot of the military's tech and cyber work. It's known for comfortable bases and many jobs that turn into civilian careers.",
    traits: { sea: -2, land: 0, air: 2, space: 1, physical: -1, tech: 2, tradition: -1, travel: 0, homeland: 0, combat: -1, scale: 1, comfort: 2 },
  },
  sf: {
    name: "Space Force",
    color: "#b9a6f0",
    tagline: "The newest and smallest branch, working in orbit.",
    about: "Created in 2019, the Space Force operates satellites, missile warning, GPS and space tracking. Its members are called Guardians. It's small and very tech focused, so most jobs involve screens and systems rather than field work.",
    traits: { sea: -2, land: -1, air: 0, space: 2, physical: -2, tech: 2, tradition: -1, travel: -1, homeland: 0, combat: -2, scale: -2, comfort: 2 },
  },
  cg: {
    name: "Coast Guard",
    color: "#f08a3c",
    tagline: "Rescues and law enforcement on U.S. waters.",
    about: "In peacetime the Coast Guard is part of the Department of Homeland Security. It does search and rescue, stops drug smuggling, enforces maritime law and protects the environment, mostly close to U.S. coasts. It's small, and its missions happen at home.",
    traits: { sea: 2, land: -1, air: 0, space: -2, physical: 1, tech: 0, tradition: 0, travel: -2, homeland: 2, combat: -1, scale: -2, comfort: 0 },
  },
};

const ORDER = ["army", "usmc", "navy", "af", "sf", "cg"];

// Each option nudges one or more traits. Questions are deliberately indirect,
// so no single answer decides the result.
const QUESTIONS = [
  { topic: "Environment", q: "Pick the view from your workplace window.", options: [
    { t: "Endless ocean in every direction", w: { sea: 2, land: -1 } },
    { t: "Forests, deserts or mountains", w: { land: 2, sea: -1 } },
    { t: "A flight line full of aircraft", w: { air: 2 } },
    { t: "No window, just a wall of screens tracking satellites", w: { space: 2, tech: 1, physical: -1 } },
  ] },
  { topic: "Free time", q: "A free weekend. Which trip do you pick?", options: [
    { t: "Backpacking and sleeping on the ground", w: { physical: 1, comfort: -2, land: 1 } },
    { t: "Fishing or boating", w: { sea: 2 } },
    { t: "An air show or a space center", w: { air: 1, space: 1, tech: 1 } },
    { t: "A nice hotel with good Wi-Fi", w: { comfort: 2, physical: -1 } },
  ] },
  { topic: "Sea time", q: "How do you feel about living on a ship for months?", options: [
    { t: "Sounds like an adventure", w: { sea: 2, travel: 1 } },
    { t: "Days or weeks on a boat, sure. Months is a lot", w: { sea: 1, travel: -1 } },
    { t: "I'd rather keep my feet on the ground", w: { sea: -1 } },
    { t: "I get seasick just thinking about it", w: { sea: -2 } },
  ] },
  { topic: "Fitness", q: "A 12-mile hike carrying a heavy pack sounds...", options: [
    { t: "Like a good day", w: { physical: 2, land: 1 } },
    { t: "Tough, but I'd push through", w: { physical: 1 } },
    { t: "Like something I'd do only if I had to", w: { physical: -1 } },
    { t: "Like a hard pass", w: { physical: -2 } },
  ] },
  { topic: "Combat", q: "How do you feel about possibly being in direct combat?", options: [
    { t: "It's a big part of why I'd join", w: { combat: 2 } },
    { t: "I'd accept it if it came to that", w: { combat: 1 } },
    { t: "I'd prefer a support or technical role", w: { combat: -1, tech: 1 } },
    { t: "I want to protect and help people, not fight", w: { combat: -2, homeland: 1 } },
  ] },
  { topic: "Tech", q: "A friend's computer stops working. You...", options: [
    { t: "Open it up and fix it", w: { tech: 2 } },
    { t: "Look it up and probably figure it out", w: { tech: 1 } },
    { t: "Tell them to take it to a shop", w: { tech: -1 } },
    { t: "Would rather be outside than fixing anything", w: { tech: -2, land: 1 } },
  ] },
  { topic: "Discipline", q: "Daily inspections, perfect uniforms, marching in step:", options: [
    { t: "Love it. Discipline makes me better", w: { tradition: 2 } },
    { t: "Fine with it", w: { tradition: 1 } },
    { t: "I'd put up with it", w: { tradition: -1 } },
    { t: "It would drive me up the wall", w: { tradition: -2 } },
  ] },
  { topic: "Travel", q: "How often do you want to be away from home?", options: [
    { t: "As much as possible", w: { travel: 2 } },
    { t: "Some deployments are fine", w: { travel: 1 } },
    { t: "Rarely", w: { travel: -1, homeland: 1 } },
    { t: "I want to stay in the U.S.", w: { travel: -2, homeland: 2 } },
  ] },
  { topic: "Purpose", q: "Which headline would make you proudest to be part of?", options: [
    { t: "\"Rescuers pull 40 people from hurricane floodwaters\"", w: { homeland: 2, sea: 1 } },
    { t: "\"Troops secure key city overseas\"", w: { combat: 2, land: 1, travel: 1 } },
    { t: "\"Carrier group arrives to calm tensions abroad\"", w: { sea: 2, travel: 2 } },
    { t: "\"New satellites keep GPS safe from jamming\"", w: { space: 2, tech: 2 } },
    { t: "\"Airlift gets supplies across the globe in 24 hours\"", w: { air: 2, travel: 1 } },
  ] },
  { topic: "Size", q: "Big organization or small?", options: [
    { t: "The biggest, with the most options", w: { scale: 2 } },
    { t: "Big, but not giant", w: { scale: 1 } },
    { t: "Small, where I'd stand out", w: { scale: -2 } },
  ] },
  { topic: "Options", q: "How do you feel about picking a job?", options: [
    { t: "Give me hundreds of choices, I want to explore", w: { scale: 2, comfort: 1 } },
    { t: "A solid list is fine", w: { scale: 1 } },
    { t: "I already know exactly what I want to do", w: { scale: -1 } },
    { t: "Doesn't matter, the mission and the people matter more", w: { tradition: 2, comfort: -1 } },
  ] },
  { topic: "Boot camp", q: "Which boot camp would you choose?", options: [
    { t: "The longest and hardest one, no shortcuts", w: { physical: 2, tradition: 2, comfort: -2 } },
    { t: "Tough, but standard", w: { physical: 1, tradition: 1 } },
    { t: "Swimming, seamanship and survival training", w: { sea: 2, physical: 1 } },
    { t: "Shorter, then straight into technical school", w: { tech: 2, physical: -1, comfort: 1 } },
  ] },
  { topic: "Team", q: "What's your ideal team?", options: [
    { t: "A big unit with hundreds of people", w: { scale: 2 } },
    { t: "A crew of a couple dozen", w: { scale: 0, sea: 1 } },
    { t: "A small team of specialists", w: { scale: -1, tech: 1 } },
    { t: "A four-person fire team, tight like family", w: { combat: 1, physical: 1 } },
  ] },
  { topic: "Living", q: "Pick a place to live.", options: [
    { t: "A bunk on a ship with my crew", w: { sea: 2, comfort: -1 } },
    { t: "Out in the field sometimes, roughing it", w: { land: 2, comfort: -2 } },
    { t: "A nice dorm, a good gym and decent food", w: { comfort: 2 } },
    { t: "A small station in a coastal town", w: { homeland: 1, sea: 1, scale: -1 } },
  ] },
  { topic: "Pace", q: "Pick a pace of life.", options: [
    { t: "Ready to deploy anywhere on short notice", w: { travel: 2, combat: 1 } },
    { t: "Long missions, then long breaks", w: { sea: 1, travel: 1 } },
    { t: "A steady, predictable schedule", w: { comfort: 1, travel: -1 } },
    { t: "On call for emergencies close to home", w: { homeland: 2, travel: -1 } },
  ] },
  { topic: "Pressure", q: "A storm hits and a boat is sinking offshore. Where do you want to be?", options: [
    { t: "In the helicopter heading out to pull people out", w: { homeland: 2, sea: 1, air: 1 } },
    { t: "On a ship nearby, turning to help", w: { sea: 2 } },
    { t: "Coordinating everything from the operations center", w: { tech: 1, combat: -1 } },
    { t: "Honestly, I'd rather be the one storming a beach", w: { combat: 2, sea: 1, land: 1 } },
  ] },
  { topic: "Future", q: "What do you want to do after you get out?", options: [
    { t: "A tech career: IT, cyber or engineering", w: { tech: 2 } },
    { t: "Police, firefighting or EMS", w: { homeland: 2, physical: 1 } },
    { t: "A skilled trade: mechanic, electrician, welder", w: { tech: 1, comfort: -1 } },
    { t: "Aviation: airline pilot or aircraft mechanic", w: { air: 2 } },
    { t: "Leading people and running things", w: { tradition: 1, combat: 1 } },
  ] },
  { topic: "Games", q: "Which kind of game do you pick?", options: [
    { t: "Squad-based shooter", w: { combat: 1, land: 1 } },
    { t: "Flight sim", w: { air: 2 } },
    { t: "Strategy, building something huge", w: { scale: 1, tech: 1 } },
    { t: "Survival or exploration", w: { physical: 1, comfort: -1 } },
    { t: "Space sim", w: { space: 2 } },
  ] },

// Civilian careers that military experience in each area commonly leads to.
// Some need extra licenses, certifications or school after service.
const CIVILIAN = {
  infantry: ["police officer", "federal law enforcement", "firefighter", "security contractor"],
  weapons: ["firearms instructor", "gunsmith", "range safety officer"],
  medical: ["EMT or paramedic", "ER technician", "nurse (with more school)", "physician assistant (with more school)"],
  build: ["construction", "electrician", "carpenter", "construction project manager"],
  mechanic: ["diesel or auto mechanic", "industrial maintenance tech", "power plant operator"],
  cyber: ["cybersecurity analyst", "network administrator", "penetration tester"],
  intel: ["intelligence analyst (government or contractor)", "data analyst", "federal agent"],
  law: ["police officer", "federal agent", "corrections officer", "private security"],
  aviation: ["airline or charter pilot", "aircraft mechanic", "flight operations"],
  elite: ["federal tactical teams", "security consulting", "wilderness EMT", "firefighter"],
  logistics: ["truck driver (CDL)", "supply chain manager", "warehouse operations manager"],
  comms: ["telecom technician", "radio and satellite technician", "emergency dispatcher"],
};

// Jobs whose civilian path is more specific than their interest tags.
const CIVILIAN_OVERRIDES = {
  "Nuclear Field Technician": ["nuclear power plant operator", "electrician", "power plant technician"],
  "Submarine Officer": ["nuclear power plant manager", "engineering manager"],
  "Air Traffic Controller": ["FAA air traffic controller", "airport operations"],
  "Helicopter Repairer": ["helicopter or aircraft mechanic (A&P license)", "aviation maintenance"],
  "Aircraft Maintenance Marine": ["aircraft mechanic (A&P license)", "aviation maintenance"],
  "Aviation Machinist's Mate": ["aircraft engine mechanic (A&P license)", "turbine technician"],
  "Aircraft Maintenance (Crew Chief)": ["aircraft mechanic (A&P license)", "aviation maintenance"],
  "Aviation Maintenance Technician": ["aircraft mechanic (A&P license)", "aviation maintenance"],
  "Motor Transport Operator": ["truck driver (CDL)", "logistics coordinator", "fleet manager"],
  "Motor Vehicle Operator": ["truck driver (CDL)", "logistics coordinator", "fleet manager"],
  "Seabee: Equipment Operator": ["heavy equipment operator", "crane operator", "construction"],
  "Seabee: Construction Electrician": ["electrician", "power lineman", "construction"],
  "Navy Diver": ["commercial diver", "underwater welder", "salvage diver"],
  "Damage Controlman": ["firefighter", "welder", "industrial safety"],
  "Aviation Survival Technician": ["rescue swimmer or lifeguard", "paramedic", "firefighter"],
  "Pararescue (PJ)": ["paramedic", "wilderness medicine", "federal rescue teams"],
  "Army Aviator": ["helicopter pilot (medevac, news, tours)", "airline pilot"],
  "Pilot": ["airline pilot", "corporate or charter pilot"],
  "Naval Aviator": ["airline pilot", "corporate or charter pilot"],
  "Marine Pilot": ["airline pilot", "corporate or charter pilot"],
  "Coast Guard Aviator": ["helicopter pilot (medevac, offshore)", "airline pilot"],
};

function civilianCareers(job) {
  if (CIVILIAN_OVERRIDES[job.n]) return CIVILIAN_OVERRIDES[job.n];
  // Main tags first, then secondary tags, without repeats.
  const tags = Object.entries(job.i).sort((a, b) => b[1] - a[1]).map(([k]) => k);
  return [...new Set(tags.flatMap((k, n) => CIVILIAN[k].slice(0, n === 0 ? 3 : 1)))].slice(0, 4);
}

// Notes shown when a top interest has no matching job in a branch.
const INTEREST_NOTES = {
  usmc: { medical: "The Marines don't have their own medics. Navy Hospital Corpsmen serve with Marine units, so the Navy is the way to be a Marine unit's medic." },
  sf: { medical: "The Space Force doesn't have its own medical jobs. Air Force medical personnel take care of Guardians." },
};

function interestVector(answers) {
  const v = {};
  answers.forEach((idx, i) => {
    if (idx == null) return;
    for (const [k, x] of Object.entries(QUESTIONS[i].options[idx].i || {})) v[k] = (v[k] || 0) + x;
  });
  return v;
}

// Ranks a branch's jobs on the chosen track. A job scores the user's interest
// in its best-matching tag, plus half credit for the next one, a quarter for
// the one after, and so on (main tags count double). So a job is driven by
// the user's strongest matching interest, extra matching tags add a bonus,
// and on a tie the more focused job wins.
function topJobs(answers, branch, track, count = 3) {
  const user = interestVector(answers);
  return JOBS[branch]
    .filter((j) => j.tr === track)
    .map((j, order) => {
      const parts = Object.entries(j.i).map(([k, x]) => (user[k] || 0) * (x / 2)).sort((a, b) => b - a);
      const fit = parts.reduce((a, v, n) => a + v / 2 ** n, 0);
      const shared = Object.keys(j.i).filter((k) => user[k]).sort((a, b) => user[b] * j.i[b] - user[a] * j.i[a]);
      return { ...j, fit, shared, order, tags: parts.length };
    })
    .sort((a, b) => b.fit - a.fit || a.tags - b.tags || a.order - b.order)
    .slice(0, count);
}

function interestNote(answers, branch) {
  const notes = INTEREST_NOTES[branch];
  if (!notes) return null;
  const user = interestVector(answers);
  const top = Object.keys(user).sort((a, b) => user[b] - user[a]).slice(0, 2);
  const hit = top.find((k) => notes[k]);
  return hit ? notes[hit] : null;
}

function joinWords(words) {
  return words.length < 2 ? words.join("") : words.slice(0, -1).join(", ") + " and " + words[words.length - 1];
}

const TRAIT_IDS = Object.keys(TRAITS);

// The user's profile is the average nudge per trait. Traits answered more
// often count more, up to a cap, so one stray answer can't dominate.
function profile(answers) {
  const sum = {}, n = {};
  answers.forEach((idx, i) => {
    if (idx == null) return;
    for (const [t, v] of Object.entries(QUESTIONS[i].options[idx].w)) {
      sum[t] = (sum[t] || 0) + v;
      n[t] = (n[t] || 0) + 1;
    }
  });
  const out = {};
  for (const t of TRAIT_IDS) {
    if (n[t]) out[t] = { value: sum[t] / n[t], weight: Math.min(n[t], 4) };
  }
  return out;
}

// Cosine similarity between the user's leanings and the branch profile, over
// the traits the user actually answered. Comparing direction rather than
// distance keeps middle-of-the-road profiles from winning by default.
function match(user, branch) {
  let dot = 0, uu = 0, pp = 0;
  for (const [t, u] of Object.entries(user)) {
    const p = BRANCHES[branch].traits[t];
    dot += u.weight * u.value * p;
    uu += u.weight * u.value * u.value;
    pp += u.weight * p * p;
  }
  return uu && pp ? dot / Math.sqrt(uu * pp) : 0;
}

function score(answers) {
  const user = profile(answers);
  return ORDER
    .map((b) => ({ id: b, raw: match(user, b) }))
    .map((r) => ({ ...r, pct: Math.round(((r.raw + 1) / 2) * 100) }))
    .sort((a, b) => b.raw - a.raw || ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
}

// Scores a set of options (components or tracks) stored under `field` on each
// answer, as a share of the most each option could have earned.
function categoryScore(answers, field, ids) {
  const raw = Object.fromEntries(ids.map((k) => [k, 0]));
  const max = Object.fromEntries(ids.map((k) => [k, 0]));
  QUESTIONS.forEach((q, i) => {
    for (const k of ids) max[k] += Math.max(0, ...q.options.map((o) => (o[field] && o[field][k]) || 0));
    const picked = answers[i] == null ? {} : q.options[answers[i]][field] || {};
    for (const k of ids) raw[k] += picked[k] || 0;
  });
  return ids
    .map((k) => ({ id: k, pct: max[k] ? Math.round((raw[k] / max[k]) * 100) : 0 }))
    .sort((a, b) => b.pct - a.pct || ids.indexOf(a.id) - ids.indexOf(b.id));
}

function componentScore(answers) {
  return categoryScore(answers, "c", COMPONENT_ORDER);
}

function trackScore(answers) {
  return categoryScore(answers, "k", TRACK_ORDER);
}

// Turns a branch and component into a real service option. Only the Army and
// Air Force have a National Guard, and the Space Force has no separate
// Reserve or Guard, so those combinations come with a note instead.
function serviceOption(branch, component) {
  const name = BRANCHES[branch].name;
  if (component === "active") return { title: `Active Duty ${name}` };
  if (branch === "sf") {
    return {
      title: "Space Force (part-time)",
      note: "The Space Force has no separate Reserve or National Guard. A law passed in late 2023 lets it offer part-time service inside the Space Force itself, and it selected its first part-time Guardians (transferring from the Air Force Reserve) in 2026. Spots are limited, so ask a recruiter. The Air Force Reserve and Air National Guard are the closest part-time alternatives.",
    };
  }
  if (component === "reserve") return { title: `${name} Reserve` };
  if (branch === "army") return { title: "Army National Guard" };
  if (branch === "af") return { title: "Air National Guard" };
  return {
    title: `${name} Reserve`,
    note: `The ${name} doesn't have a National Guard, so its Reserve is the closest part-time option. If serving your own state matters most to you, look at the Army National Guard or Air National Guard too.`,
  };
}

function phrase(t, v) {
  return v > 0 ? TRAITS[t].pos : TRAITS[t].neg;
}

function capitalize(s) {
  return s[0].toUpperCase() + s.slice(1);
}

// Strong traits the user shares with the branch, strongest first.
function fits(user, branch) {
  const p = BRANCHES[branch].traits;
  return Object.entries(user)
    .filter(([t, u]) => Math.abs(u.value) >= 0.75 && Math.abs(p[t]) >= 1 && Math.sign(u.value) === Math.sign(p[t]))
    .sort((a, b) => b[1].weight * Math.abs(b[1].value) - a[1].weight * Math.abs(a[1].value))
    .map(([t, u]) => phrase(t, u.value));
}

// Places where the branch pulls the opposite way from the user.
function clashes(user, branch) {
  const p = BRANCHES[branch].traits;
  return Object.entries(user)
    .map(([t, u]) => ({ t, u, gap: Math.abs(u.value - p[t]) }))
    .filter(({ t, u, gap }) => gap >= 2 && Math.abs(p[t]) >= 1 && Math.abs(u.value) >= 0.5 && Math.sign(u.value) !== Math.sign(p[t]))
    .sort((a, b) => b.gap * b.u.weight - a.gap * a.u.weight)
    .map(({ t, u }) => `The ${BRANCHES[branch].name} leans toward ${phrase(t, BRANCHES[branch].traits[t])}, but you leaned toward ${phrase(t, u.value)}.`);
}

// Skipped questions stay null in answers, so scoring simply ignores them.
const state = { step: -1, answers: [], skipped: new Set() };
const app = document.getElementById("app");

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "style") node.style.cssText = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) {
    if (c != null) node.append(c.nodeType ? c : document.createTextNode(c));
  }
  return node;
}

function render() {
  parseRoute();
  renderNav();
  app.replaceChildren();
  if (route.page === "branches") renderBranches();
  else if (route.page === "branch") renderBranch();
  else if (route.page === "types") renderTypes();
  else if (route.page === "training") renderTraining();
  else if (state.step < 0) renderIntro();
  else if (state.step < QUESTIONS.length) renderQuestion();
  else renderResults();
  const titles = { branches: "Branches", types: "Service types", training: "Boot camp & training" };
  const pageTitle = route.page === "branch" ? BRANCHES[route.branch].name : titles[route.page];
  document.title = pageTitle ? `${pageTitle} · Ranked Bingo` : "Ranked Bingo";
  window.scrollTo({ top: 0 });
}

window.addEventListener("hashchange", render);

function renderIntro() {
  app.append(el("div", { class: "card fade-in" },
    el("div", { class: "eyebrow" }, "Ranked Bingo"),
    el("h1", {}, "Which military branch fits you?"),
    el("p", { class: "muted" },
      `${QUESTIONS.length} questions about how you like to live, work, train and think. No single answer decides anything: each one shifts a set of traits, and you're matched to the branch whose overall profile is closest to yours. Then a few questions pick your top jobs, enlisted or officer, and Active Duty, the Reserve or the National Guard.`),
    el("div", { class: "chips branch-strip" },
      ORDER.map((b) => el("span", { class: "chip" },
        el("span", { class: "dot", style: `background:${BRANCHES[b].color}` }), BRANCHES[b].name))),
    el("button", { class: "primary", onclick: () => { state.step = 0; render(); } }, "Start the quiz"),
  ));
}

function renderQuestion() {
  const i = state.step;
  const q = QUESTIONS[i];
  const chosen = state.answers[i];
  const skipped = state.skipped.has(i);

  const options = q.options.map((o, idx) => el("button", {
    class: "option" + (chosen === idx ? " selected" : ""),
    "aria-pressed": String(chosen === idx),
    onclick: () => choose(idx),
  }, el("span", { class: "key" }, String((idx + 1) % 10)),
    el("span", {}, o.t, DEBUG ? el("span", { class: "debug" }, describeEffects(o)) : null)));

  app.append(el("div", { class: "card fade-in" },
    el("div", { class: "progress-row" },
      el("span", {}, `Question ${i + 1} / ${QUESTIONS.length}`),
      el("span", {}, q.topic)),
    el("div", { class: "progress" }, el("div", { style: `width:${(i / QUESTIONS.length) * 100}%` })),
    el("h2", {}, q.q),
    DEBUG ? el("div", { class: "debug debug-live" }, "Live: " +
      score(state.answers).slice(0, 3).map((r) => `${BRANCHES[r.id].name} ${r.pct}%`).join(" · ")) : null,
    el("div", { class: "options", role: "group", "aria-label": q.q }, options),
    el("button", { class: "skip" + (skipped ? " selected" : ""), "aria-pressed": String(skipped), onclick: skip },
      "None of these fit me, skip"),
    el("div", { class: "nav" },
      el("button", { onclick: back }, i === 0 ? "Intro" : "Back"),
      el("button", { class: "primary", disabled: chosen == null && !skipped, onclick: next },
        i === QUESTIONS.length - 1 ? "See my results" : "Next")),
  ));
}

// Add ?debug to the URL to see what every answer scores, for playtesting.
const DEBUG = new URLSearchParams(location.search).has("debug");

function describeEffects(o) {
  const fmt = (obj, label = (k) => k) => Object.entries(obj || {}).map(([k, v]) => `${label(k)} ${v > 0 ? "+" : ""}${v}`);
  const parts = [
    ...fmt(o.w),
    ...fmt(o.i, (k) => `job:${k}`),
    ...fmt(o.k),
    ...fmt(o.c),
  ];
  return parts.length ? parts.join(", ") : "no effect";
}

let advanceTimer = 0;

function choose(idx) {
  state.answers[state.step] = idx;
  state.skipped.delete(state.step);
  render();
  autoAdvance();
}

function skip() {
  state.answers[state.step] = null;
  state.skipped.add(state.step);
  render();
  autoAdvance();
}

// Moves on after a short beat so the selection is visible.
function autoAdvance() {
  clearTimeout(advanceTimer);
  const step = state.step;
  advanceTimer = setTimeout(() => { if (state.step === step) next(); }, 220);
}

function next() {
  if (state.answers[state.step] == null && !state.skipped.has(state.step)) return;
  state.step += 1;
  render();
}

function back() {
  clearTimeout(advanceTimer);
  state.step -= 1;
  render();
}

const MIN_ANSWERS = 10;

function renderResults() {
  const answered = state.answers.filter((a) => a != null).length;
  if (answered < MIN_ANSWERS) {
    app.append(el("div", { class: "card fade-in" },
      el("div", { class: "eyebrow" }, "Not enough intel"),
      el("h1", {}, "Answer a few more"),
      el("p", { class: "muted" },
        `You answered ${answered} of ${QUESTIONS.length} questions. Answer at least ${MIN_ANSWERS} so there's enough to match you on.`),
      el("div", { class: "actions" },
        el("button", { class: "primary", onclick: () => { state.step = state.skipped.size ? Math.min(...state.skipped) : 0; render(); } }, "Go back to skipped questions"),
        el("button", { onclick: restart }, "Start over")),
    ));
    return;
  }
  const ranked = score(state.answers);
  const user = profile(state.answers);
  const top = ranked[0];
  // Branches with the same rounded score are shown as a tie rather than
  // quietly picking one on decimals.
  const tied = ranked.filter((r) => r.pct === top.pct);
  const isTie = tied.length > 1;
  const names = joinWords(tied.map((r) => BRANCHES[r.id].name));
  const info = BRANCHES[top.id];
  const components = componentScore(state.answers);
  const tracks = trackScore(state.answers);
  const track = TRACKS[tracks[0].id];
  const hasDegree = state.answers.some((idx, i) => idx != null && QUESTIONS[i].options[idx].degree);
  const options = tied.map((r) => serviceOption(r.id, components[0].id));
  const jobNotes = tied.map((r) => interestNote(state.answers, r.id)).filter(Boolean);
  const strongest = Object.entries(user)
    .filter(([, u]) => Math.abs(u.value) >= 1)
    .sort((a, b) => b[1].weight * Math.abs(b[1].value) - a[1].weight * Math.abs(a[1].value))
    .slice(0, 6);

  const why = tied.flatMap((r) => fits(user, r.id).slice(0, isTie ? 3 : 5)
    .map((w) => `You lean toward ${w}, and so does the ${BRANCHES[r.id].name}.`));
  const headsUp = tied.flatMap((r) => clashes(user, r.id).slice(0, isTie ? 2 : 3));

  const jobCards = tied.flatMap((r) => {
    const b = BRANCHES[r.id];
    return topJobs(state.answers, r.id, tracks[0].id, isTie ? 2 : 3).map((j, n) =>
      el("div", { class: "job", style: `--hero:${b.color}` },
        el("div", { class: "job-path" }, `#${n + 1} · ${b.name} · ${track.name}`),
        el("strong", { class: "job-name" }, j.n),
        el("p", { class: "muted", style: "margin:4px 0 0" }, j.d),
        j.shared.length ? el("p", { style: "margin:6px 0 0; font-size:14px" },
          `Fits your interest in ${joinWords(j.shared.slice(0, 2).map((k) => INTERESTS[k]))}.`) : null,
        el("p", { style: "margin:6px 0 0; font-size:14px" }, el("strong", {}, "After you get out: "), civilianCareers(j).join(", ")),
        el("a", { href: branchLink(r.id, tracks[0].id, components[0].id), style: "display:inline-block; margin-top:8px; font-size:14px" }, "See this path →")));
  });

  const bars = ranked.map((r) => {
    const fill = el("div", { style: `background:${BRANCHES[r.id].color}` });
    requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = r.pct + "%"; }));
    return el("div", { class: "bar-row" },
      el("span", {}, BRANCHES[r.id].name),
      el("div", { class: "bar", role: "img", "aria-label": `${BRANCHES[r.id].name} ${r.pct}%` }, fill),
      el("span", { class: "num" }, r.pct + "%"));
  });

  // Every other branch within 10 points of the top is shown as a close match;
  // otherwise just the runner-up.
  const rest = ranked.slice(tied.length);
  const closeOnes = rest.filter((r) => top.pct - r.pct <= 10);
  const others = closeOnes.length ? closeOnes : rest.slice(0, 1);
  const otherCards = others.map((r) => {
    const b = BRANCHES[r.id];
    const reasons = fits(user, r.id).slice(0, 2);
    return el("div", { class: "runner-up", style: `border-left:4px solid ${b.color}` },
      el("strong", {}, `${b.name} (${r.pct}%)`),
      el("p", { class: "muted", style: "margin:6px 0 0" }, b.tagline),
      reasons.length ? el("p", { style: "margin:8px 0 0; font-size:14px" },
        `Shares your lean toward ${reasons.join(" and ")}.`) : null,
      el("p", { style: "margin:8px 0 0; font-size:14px" },
        "Top role: ", el("strong", {}, topJobs(state.answers, r.id, tracks[0].id, 1)[0].n)));
  });

  app.append(el("div", { class: "card fade-in" },
    el("div", { class: "eyebrow" }, isTie ? "It's a tie!" : "Your best match"),
    el("div", { class: "result-hero", style: `--hero:${info.color}` },
      el("h1", {}, names),
      el("div", { class: "pct" }, isTie ? `${top.pct}% MATCH EACH` : `${top.pct}% MATCH`),
      isTie
        ? el("p", { style: "margin-top:12px" }, "Your answers fit these branches equally well, so both are worth a serious look.")
        : el("p", { style: "margin-top:12px" }, info.tagline),
      el("p", { style: "margin:0" }, isTie ? "Best ways to serve: " : "Best way to serve: ",
        el("strong", {}, options.map((o) => `${o.title}, ${track.name}`).join(" or ")))),
    tied.map((r) => el("p", {}, isTie ? el("strong", {}, BRANCHES[r.id].name + ": ") : null, BRANCHES[r.id].about)),

    el("div", { class: "section-title" }, "Top roles for you"),
    el("div", { class: "jobs" }, jobCards),
    jobNotes.map((n) => el("div", { class: "note", style: "margin-top:12px" }, n)),
    el("p", { class: "muted", style: "margin:10px 0 0; font-size:13px" },
      "Job names are simplified. Every branch has many more jobs, and which ones you can get depends on test scores, physical standards and openings. Civilian careers are common paths, and some need extra licenses or school."),

    strongest.length ? [
      el("div", { class: "section-title" }, "Your profile"),
      el("div", { class: "chips" }, strongest.map(([t, u]) => el("span", { class: "chip" }, capitalize(phrase(t, u.value))))),
    ] : null,

    why.length ? [
      el("div", { class: "section-title" }, "Why you matched"),
      el("ul", { class: "list good" }, why.map((w) =>

function restart() {
  state.step = -1;
  state.answers = [];
  state.skipped.clear();
  render();
}

async function copyResult(e) {
  const ranked = score(state.answers);
  const tied = ranked.filter((r) => r.pct === ranked[0].pct);
  const componentId = componentScore(state.answers)[0].id;
  const trackId = trackScore(state.answers)[0].id;
  const picks = tied.map((r) => {
    const job = topJobs(state.answers, r.id, trackId, 1)[0];
    return `${serviceOption(r.id, componentId).title}, ${TRACKS[trackId].name} (top role: ${job.n})`;
  });
  const header = tied.length > 1
    ? ["My Ranked Bingo result: a tie!", ...picks]
    : [`My Ranked Bingo result: ${picks[0]}`];
  const text = [...header, ...ranked.map((r) => `${BRANCHES[r.id].name}: ${r.pct}%`)].join("\n");
  const btn = e.currentTarget;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "Copied!";
  } catch {
    btn.textContent = "Couldn't copy";
  }
  setTimeout(() => { btn.textContent = "Copy my result"; }, 1500);
}

document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (route.page !== "quiz") return;
  if (state.step < 0 || state.step >= QUESTIONS.length) return;
  const n = e.key === "0" ? 10 : Number(e.key);
  if (n >= 1 && n <= QUESTIONS[state.step].options.length) choose(n - 1);
  else if (e.key === "s") skip();
  else if (e.key === "ArrowLeft") { if (state.step > 0) back(); }
  else if (e.key === "ArrowRight" || e.key === "Enter") next();
});

function parseRoute() {
  const [path, query = ""] = location.hash.replace(/^#\/?/, "").split("?");
  const parts = path.split("/").filter(Boolean);
  const params = new URLSearchParams(query);
  route.page = parts[0] || "quiz";
  route.branch = ORDER.includes(parts[1]) ? parts[1] : null;
  route.track = TRACK_ORDER.includes(params.get("track")) ? params.get("track") : "enlisted";
  route.type = COMPONENT_ORDER.includes(params.get("type")) ? params.get("type") : "active";
  if (route.page === "branch" && !route.branch) route.page = "branches";
  if (!["quiz", "branches", "branch", "types", "training"].includes(route.page)) route.page = "quiz";
}

    el("p", { class: "muted", style: "margin:4px 0 10px" }, `${bc.where}. Instructors: ${bc.leaders}.`),
    el("ol", { class: "steps compact" }, bc.phases.map(([t, x]) => el("li", {}, el("strong", {}, t), el("p", { class: "muted", style: "margin:2px 0 0" }, x)))),
    el("p", { style: "margin:10px 0 0" }, el("strong", {}, `After: ${d.tech.name}. `), d.tech.text),
    el("p", { style: "margin:8px 0 0" }, el("strong", {}, "Officers: "), d.officer));
}

function renderTypes() {
  app.append(el("div", { class: "fade-in" },
    el("div", { class: "eyebrow" }, "Explore"),
    el("h1", {}, "Ways to serve"),
    el("p", { class: "muted" }, "Every branch has full-time and part-time options, and every job is either enlisted or officer."),
    el("div", { class: "section-title" }, "Service types"),
    el("div", { class: "jobs" }, COMPONENT_ORDER.map((c) => el("div", { class: "job", style: "--hero:var(--accent)" },
      el("strong", { class: "job-name" }, COMPONENTS[c].name),
      el("p", { style: "margin:6px 0 0" }, COMPONENTS[c].about),
      el("p", { style: "margin:8px 0 0" }, el("strong", {}, "Schedule: "), COMPONENT_DETAILS[c].schedule),
      el("ul", { class: "list good", style: "margin-top:8px" }, COMPONENT_DETAILS[c].life.map((x) => el("li", {}, el("span", { class: "mark" }, "•"), el("span", {}, x))))))),
    el("div", { class: "section-title" }, "Who has what"),
    el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Branch"), COMPONENT_ORDER.map((c) => el("th", {}, COMPONENTS[c].name)))),
      el("tbody", {}, ORDER.map((b) => el("tr", {},
        el("td", {}, el("a", { href: branchLink(b) }, BRANCHES[b].name)),
        COMPONENT_ORDER.map((c) => {
          const o = serviceOption(b, c);
          const exact = c === "active" || !o.note;
          return el("td", {}, exact ? el("a", { href: branchLink(b, "enlisted", c) }, o.title) : el("span", { class: "muted" }, b === "sf" ? "Part-time inside the Space Force" : "None (use the Reserve)"));
        })))))),
    el("div", { class: "section-title" }, "Enlisted or officer"),
    el("div", { class: "two-col" }, TRACK_ORDER.map((t) => el("div", { class: "job", style: "--hero:var(--accent)" },
      el("strong", { class: "job-name" }, TRACKS[t].name),
      el("p", { style: "margin:6px 0 0" }, TRACKS[t].about)))),
  ));
}

function renderTraining() {
  app.append(el("div", { class: "fade-in" },
    el("div", { class: "eyebrow" }, "Explore"),
    el("h1", {}, "Boot camp & training"),
    el("p", { class: "muted" }, "How you get from civilian to trained service member, branch by branch. Checked against official branch recruiting sites in October 2026. Lengths and locations change, so confirm them with a recruiter."),
    el("div", { class: "section-title" }, "How it works everywhere"),
    el("ol", { class: "steps" }, [
      ["Recruiter", "You talk to a recruiter, check that you qualify, and start paperwork."],
      ["MEPS", "At the Military Entrance Processing Station you get a medical exam, pick or reserve your job and swear in. You take the ASVAB test there or beforehand at a testing site."],
      ["Ship to boot camp", "Haircuts, uniforms, shots and paperwork in the first days, then weeks of fitness, drill, discipline, weapons and military basics, led by instructors whose title depends on the branch."],
      ["Job training", "After boot camp you learn your actual job. The school's name and length depend on the branch and job: from a few weeks to more than a year."],
      ["Your first unit", "Active duty members report to a duty station. Reserve and Guard members return home and drill with their unit."],
    ].map(([t, x]) => el("li", {}, el("strong", {}, t), el("p", { class: "muted", style: "margin:2px 0 0" }, x)))),
    el("div", { class: "note", style: "margin-top:14px" }, "Tip: show up in shape. Practice running, push-ups, sit-ups or planks, and swimming before you ship."),
    el("div", { class: "section-title" }, "Branch by branch"),
    el("div", { class: "jobs" }, ORDER.map((b) => trainingCard(b))),
  ));
}
window.branchQuiz = { DETAILS, route, QUESTIONS, BRANCHES, ORDER, TRAITS, profile, score, fits, clashes, componentScore, trackScore, serviceOption, topJobs, interestVector, JOBS, civilianCareers, CIVILIAN_OVERRIDES, state, render };

render();
</script>
