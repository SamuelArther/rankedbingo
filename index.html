<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranked Bingo</title>
<meta name="description" content="Answer questions about how you live, work and think to see which U.S. military branch fits you best.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f0c">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ranked Bingo">
<link rel="stylesheet" href="css/style.css">
<script>
  // Apply the saved theme (or the system's) before the page paints.
  try {
    var saved = localStorage.getItem("rankedbingo.theme");
    document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<nav id="nav" aria-label="Sections"></nav>
<main id="app" aria-live="polite"></main>
<footer>
  Just for fun. Not affiliated with or endorsed by the U.S. military or any branch.
  Talk to a recruiter from each branch you're interested in before deciding anything.
</footer>

<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/extras.js"></script>
<script src="js/jobs.js"></script>
<script src="js/info.js"></script>
<script src="js/app.js"></script>
</body>
</html>
