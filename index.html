<script>
  // Pick the language (saved choice, else the browser's) and load its
  // translations before the app scripts run.
  (function () {
    var supported = ["en", "es", "tl", "vi", "zh", "ko", "fr", "pt", "ar"];
    var lang = null;
    try { lang = localStorage.getItem("rankedbingo.lang"); } catch (e) {}
    if (!lang) {
      var nav = (navigator.language || "en").toLowerCase();
      lang = nav.indexOf("fil") === 0 ? "tl" : nav.slice(0, 2);
    }
    if (supported.indexOf(lang) < 0) lang = "en";
    window.I18N_LANG = lang;
    if (lang !== "en") document.write('<script src="lang/' + lang + '.js"><\/script>');
  })();
</script>
<script>
  // Apply the saved theme (or the system's) before the page paints.
  try {
    var saved = localStorage.getItem("rankedbingo.theme");
    document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
  try {
    var settings = JSON.parse(localStorage.getItem("rankedbingo.settings.v1")) || {};
    document.documentElement.dataset.text = settings.text || "normal";
    document.documentElement.dataset.motion = settings.motion || "auto";
  } catch (e) { /* defaults */ }
</script>
